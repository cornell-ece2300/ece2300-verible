name: ci

on:
  push:
    branches: [master, main, linter]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildAndTest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BAZEL_VERSION: 7.6.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential default-jdk python3 curl

      - name: Install Bazel
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-linux-x86_64" \
            --output "$RUNNER_TEMP/bazel"
          sudo install -m 755 "$RUNNER_TEMP/bazel" /usr/local/bin/bazel
          bazel --version
          echo "GIT_VERSION=$(git describe --match='v*' --always)" >> "$GITHUB_ENV"

      - name: Run all tests
        run: bazel test -c opt --jobs=4 --test_output=errors //...

      - name: Build binaries
        run: bazel build -c opt --jobs=4 :install-binaries
